<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}نيو دنت - نظام المحاسبة{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0d7377;
            --primary-dark: #095456;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
            background: #f4f7f8;
        }
        .sidebar {
            background: linear-gradient(180deg, #0d7377, #095456);
            min-height: 100vh;
            color: white;
            width: 240px;
            position: fixed;
            right: 0;
            top: 0;
            padding-top: 20px;
            z-index: 100;
        }
        .sidebar .brand {
            text-align: center;
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 20px;
        }
        .sidebar .brand h4 {
            margin: 0;
            font-weight: 700;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,0.85);
            padding: 12px 20px;
            border-radius: 8px;
            margin: 3px 12px;
            transition: all 0.2s;
        }
        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            background: rgba(255,255,255,0.15);
            color: white;
        }
        .sidebar .nav-link i {
            margin-left: 10px;
            width: 20px;
        }
        .main-content {
            margin-right: 240px;
            padding: 25px;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-right: 4px solid var(--primary);
        }
        .stat-card h3 {
            color: var(--primary);
            font-weight: 700;
            margin: 0;
        }
        .stat-card p {
            color: #666;
            margin: 5px 0 0;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .card-header {
            background: white;
            border-bottom: 1px solid #eee;
            font-weight: 600;
            color: var(--primary);
        }
        .btn-primary {
            background: var(--primary);
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .table th {
            background: #f0f7f8;
            color: #333;
            font-weight: 600;
        }
        .badge-low {
            background: #dc3545;
        }
        .badge-ok {
            background: #198754;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand">
            <h4>نيو دنت</h4>
            <small>NDS Accounting</small>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link {% if page == 'dashboard' %}active{% endif %}" href="/">
                <i class="bi bi-speedometer2"></i> الرئيسية
            </a>
            <a class="nav-link {% if page == 'products' %}active{% endif %}" href="/products">
                <i class="bi bi-box-seam"></i> المنتجات
            </a>
            <a class="nav-link {% if page == 'inventory' %}active{% endif %}" href="/inventory">
                <i class="bi bi-boxes"></i> المخزون
            </a>
            <a class="nav-link {% if page == 'sales' %}active{% endif %}" href="/sales">
                <i class="bi bi-receipt"></i> المبيعات
            </a>
            <a class="nav-link {% if page == 'purchases' %}active{% endif %}" href="/purchases">
                <i class="bi bi-cart-plus"></i> المشتريات
            </a>
            <a class="nav-link {% if page == 'customers' %}active{% endif %}" href="/customers">
                <i class="bi bi-people"></i> العملاء
            </a>
            <a class="nav-link {% if page == 'reports' %}active{% endif %}" href="/reports">
                <i class="bi bi-graph-up"></i> التقارير
            </a>
            <hr style="border-color:rgba(255,255,255,0.2); margin:15px 20px;">
            <a class="nav-link" href="/logout">
                <i class="bi bi-box-arrow-left"></i> تسجيل الخروج
            </a>
        </nav>
    </div>

    <div class="main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>

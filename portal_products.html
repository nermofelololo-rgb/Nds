<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار المنتجات - نيو دنت</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #f4f7f8; }
        .navbar { background: linear-gradient(90deg, #0d7377, #14919b); }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .price { color: #0d7377; font-weight: 700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold">نيو دنت — أسعار المنتجات</span>
            <div>
                <a href="/portal" class="btn btn-sm btn-outline-light me-2">فواتيري</a>
                <a href="/logout" class="btn btn-sm btn-light">خروج</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <form method="get" class="mb-3">
            <div class="input-group" style="max-width:400px;">
                <input type="text" name="q" class="form-control" placeholder="بحث عن منتج..." value="{{ q }}">
                <button class="btn btn-outline-secondary" type="submit">بحث</button>
            </div>
        </form>

        <div class="card">
            <div class="card-body p-0">
                <table class="table table-hover mb-0">
                    <thead>
                        <tr>
                            <th>المنتج</th>
                            <th>الوحدة</th>
                            <th>السعر</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in products %}
                        <tr>
                            <td>{{ p.name }}</td>
                            <td>{{ p.unit }}</td>
                            <td class="price">{{ p.sell_price }} ج.م</td>
                        </tr>
                        {% else %}
                        <tr><td colspan="3" class="text-center text-muted py-4">لا توجد نتائج</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
